name: CI

on: [push, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Zip
        run: |
          GITHUB_SHA=$(git rev-parse --short ${{ github.sha }})
          GITHUB_REF_NAME=$(echo ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }})
          tmp="$(mktemp)"
          envsubst '${GITHUB_SHA},${GITHUB_REF_NAME}' <pack.mcmeta >"$tmp" && mv "$tmp" pack.mcmeta
          zip -r "ImperiumMC.zip" assets/ pack.mcmeta pack.png

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ImperiumMC Resource Pack
          path: ImperiumMC.zip
          archive: false
          if-no-files-found: error

  release:
    name: Release
    permissions:
      contents: write
    needs: build
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download
        uses: actions/download-artifact@v8
        with:
          name: ImperiumMC.zip

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ImperiumMC ${{ github.ref_name }}
          files: ImperiumMC.zip
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
